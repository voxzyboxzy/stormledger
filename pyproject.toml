[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stormledger"
version = "0.1.0"
description = "Explainable, auditable Florida hurricane-impact intelligence. Research demonstration, not emergency guidance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb==2.0.0",
  "pandas==3.1.1",
  "pandera==0.35.0",
  "pyarrow==26.0.1",
  "scikit-learn==1.9.1",
  "numpy==2.5.4",
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "joblib==1.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
stormledger = "stormledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stormledger = ["transform/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
